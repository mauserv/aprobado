<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprobado · Packs de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8FA; --ink:#16213A; --ink2:#5B6478; --line:#E3E6EC;
  --card:#FFFFFF; --hl:#F4C744; --hlbg:#FDF1D2; --hlink:#7A5B00; --blue:#2148C7; --blueink:#FFFFFF;
  --green:#1E8E5A; --greenbg:#E3F5EC; --red:#C8412F; --redbg:#FCEAE7; --amber:#9A6B00; --amberbg:#FFF4D1;
  --dot:#C7D1E8; --wash:#EEF2FC;
  --shadow:0 1px 2px rgba(22,33,58,.06),0 1px 1px rgba(22,33,58,.04);
  --shadow-md:0 4px 14px rgba(22,33,58,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12172A; --ink:#EAEDF5; --ink2:#9BA3B8; --line:#293049;
    --card:#1A2036; --hl:#E8CE3F; --hlbg:#332A0E; --hlink:#F2CE5C; --blue:#6E8FFF; --blueink:#0E1422;
    --green:#4CC38A; --greenbg:#15302A; --red:#FF8A78; --redbg:#3A1E1B; --amber:#F2C24B; --amberbg:#352A0E;
    --dot:#28304A; --wash:#161D33;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#12172A; --ink:#EAEDF5; --ink2:#9BA3B8; --line:#293049;
  --card:#1A2036; --hl:#E8CE3F; --hlbg:#332A0E; --hlink:#F2CE5C; --blue:#6E8FFF; --blueink:#0E1422;
  --green:#4CC38A; --greenbg:#15302A; --red:#FF8A78; --redbg:#3A1E1B; --amber:#F2C24B; --amberbg:#352A0E;
  --dot:#28304A; --wash:#161D33;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.2px),linear-gradient(180deg,var(--wash),transparent 420px);
  background-size:24px 24px,100% 100%;
  background-attachment:fixed;
  font:16px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:84px;
}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.muted{color:var(--ink2)}
.small{font-size:.88rem}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;max-width:680px;margin:0 auto}
.top{align-items:flex-start;padding-top:18px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.stamp{display:inline-grid;place-items:center;width:38px;height:38px;border:3px solid var(--green);color:var(--green);border-radius:50%;transform:rotate(-8deg);font-size:1.15rem;font-weight:800;flex:none}
.slogan{display:inline-block;margin:6px 0 0 1px;background:var(--hlbg);color:var(--hlink);font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:6px}

.acct{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;flex:none;margin-top:4px;box-shadow:var(--shadow)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--blueink);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 4px}
.seg button{border:none;background:var(--card);padding:10px;font-weight:700;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.gate{text-align:center;padding:26px 14px}
.gate .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
/* hero */
.hero{padding:10px 0 6px}
.hero h1{max-width:18ch}
.hero p{max-width:46ch}
.search{display:flex;gap:8px;margin:14px 0 10px}
.search input{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.search input:focus-visible{border-color:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--blueink);border-color:var(--blue)}

/* pack cards */
.list{display:grid;gap:12px;margin-top:14px}
.folder{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:box-shadow .15s ease,border-color .15s ease}
.folder::before{content:attr(data-tab);display:block;color:var(--ink2);font-size:.78rem;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
.folder:hover{box-shadow:var(--shadow-md);border-color:var(--blue)}
.f-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.price{flex:none;background:var(--hlbg);color:var(--hlink);font-weight:800;padding:4px 10px;border-radius:8px;font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:.88rem;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink2)}
.ok{color:var(--green);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:6px}
.b-ok{background:var(--greenbg);color:var(--green)}
.b-rev{background:var(--amberbg);color:var(--amber)}
.b-bad{background:var(--redbg);color:var(--red)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:700;transition:border-color .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--ink2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--blueink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--blue)}
.btn-ghost{border-color:transparent;background:transparent;text-decoration:underline;padding:8px}
.btn-danger{color:var(--red);border-color:var(--redbg);background:var(--redbg)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* sections */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.panel h3{margin-bottom:6px}
.contents li{margin:.3rem 0}
.preview{border:1.5px dashed var(--line);border-radius:10px;padding:12px;background:var(--paper);font-size:.95rem}
.notice{border-left:4px solid var(--blue);background:var(--card);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:14px;font-size:.92rem}
.notice.warn{border-color:var(--amber)}

/* form */
label.f{display:block;font-weight:700;margin:12px 0 4px}
.help{font-weight:400;color:var(--ink2);font-size:.85rem;display:block}
input.t,select.t,textarea.t{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
textarea.t{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--blue)}
.step{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.earn{background:var(--greenbg);color:var(--green);padding:8px 12px;border-radius:8px;margin-top:8px;font-weight:700;display:inline-block}
.err{color:var(--red);font-size:.9rem;margin-top:8px}
.no-list{margin:.4rem 0;padding-left:1.1rem}
.no-list li{margin:.25rem 0}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.bottom button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;padding:6px 10px;cursor:pointer;color:var(--ink2);border-radius:10px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--blue);font-weight:700;background:color-mix(in srgb,var(--blue) 12%,transparent)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-md)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{border:none;background:none;font-size:1.6rem;cursor:pointer;line-height:1;padding:4px 8px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pay label{border:2px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:700}
.pay input{position:absolute;opacity:0}
.pay input:checked+span{color:var(--blue)}
.pay label:has(input:checked){border-color:var(--blue)}
.pay label.off{opacity:.5;cursor:not-allowed}
.pay small{display:block;font-weight:400;font-size:.72rem;color:var(--ink2)}
.qrbox{text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:6px;background:#fff;color:#1B2A4A}
.qrbox img{width:220px;max-width:100%;height:auto;display:block;margin:0 auto}
.amount{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;margin-top:8px}
.steps{padding-left:1.2rem;margin:10px 0 0}
.steps li{margin:.3rem 0}

/* viewer + watermark */
.viewer{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:18px;min-height:320px;user-select:none;-webkit-user-select:none}
.wm{position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:36px 28px;transform:rotate(-24deg);pointer-events:none;align-content:flex-start;opacity:.14;font-weight:700;font-size:.8rem;color:var(--ink)}
.viewer-content{position:relative}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:60;font-weight:700;display:none;max-width:90%}
.empty{text-align:center;padding:30px 10px}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<script>
const SUPABASE_URL = "https://zxolclbmjwjroculmbpn.supabase.co";
const SUPABASE_KEY = "sb_publishable_5DeBl_0wSxBDKn2ZmX5bEw_JB66WtdP";
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TIPOS = {
  apuntes:"Apuntes y resúmenes propios",
  ejercicios:"Ejercicios resueltos por el autor",
  videos:"Videos explicativos propios",

];
let cache={session:null,profile:null,publicPacks:[],authors:{},myPacks:[],purchases:[]};
const me=()=>cache.profile;
async function refreshSession(){
  const {data:{session}}=await supa.auth.getSession();
  cache.session=session;
  if(session){
    const {data}=await supa.from('profiles').select('*').eq('auth_user_id',session.user.id).maybeSingle();
    if(data){cache.profile=data}
    else{
      const meta=session.user.user_metadata||{};
      const {data:creado}=await supa.from('profiles').insert({auth_user_id:session.user.id,nombre:meta.nombre||session.user.email.split("@")[0],uni:meta.uni||"",carrera:meta.carrera||null}).select().maybeSingle();
      cache.profile=creado||null;
    }
  }else cache.profile=null;
}
async function loadAuthors(ids){
  const uniq=[...new Set(ids)].filter(id=>id&&!(id in cache.authors));
  if(!uniq.length)return;
  const {data}=await supa.from('autores').select('*').in('id',uniq);
  (data||[]).forEach(a=>cache.authors[a.id]=a.nombre);
}
async function loadPublicPacks(){
  const {data}=await supa.from('packs').select('*').eq('estado','publicado').order('creado_en',{ascending:false});
  cache.publicPacks=data||[];
  await loadAuthors(cache.publicPacks.map(p=>p.autor_id));
}
async function loadMine(){
  if(!me()){cache.myPacks=[];cache.purchases=[];return}
  const {data:mios}=await supa.from('packs').select('*').eq('autor_id',me().id).order('creado_en',{ascending:false});
  cache.myPacks=mios||[];
  const {data:compras}=await supa.from('purchases').select('*, packs(*)').eq('comprador_id',me().id).order('creado_en',{ascending:false});
  cache.purchases=compras||[];
  await loadAuthors(cache.myPacks.map(p=>p.autor_id).concat(cache.purchases.map(c=>c.packs&&c.packs.autor_id)));
}

let view="explorar", filtro="Todas", q="";

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function allPacks(){
  const map=new Map();
  cache.publicPacks.forEach(p=>map.set(p.id,p));
  cache.myPacks.filter(p=>p.estado==="publicado").forEach(p=>map.set(p.id,p));
  return [...map.values()];
}
function find(id){
  return cache.publicPacks.find(p=>p.id===id)||cache.myPacks.find(p=>p.id===id)||
    (cache.purchases.find(c=>c.packs&&c.packs.id===id)||{}).packs||null;
}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600)}

async function go(v){view=v;document.querySelectorAll("nav.bottom button").forEach(b=>{if(b.dataset.go===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});if((v==="compras"||v==="vender")&&me())await loadMine();render();window.scrollTo(0,0)}
document.querySelectorAll("nav.bottom button").forEach(b=>b.onclick=()=>go(b.dataset.go));

function card(p){
  return `<button class="folder" data-tab="${esc(p.uni)} · ${esc(p.curso)}" data-open="${p.id}">
    <div class="f-row"><h3>${esc(p.titulo)}</h3><span class="price">S/ ${p.precio}</span></div>
    <div class="meta"><span class="ok">✓ ${esc(cache.authors[p.autor_id]||"Autor verificado")} aprobó con ${p.nota}</span><span>★ ${p.rating} (${p.resenas})</span><span>${esc(p.seccion)}</span></div>
    <div class="tags">${p.tipos.map(t=>`<span class="tag">${esc(TIPOS[t].split(" ")[0])}</span>`).join("")}</div>
  </button>`;
}

function render(){
  if(view==="explorar") return rExplorar();
  if(view==="detalle") return rDetalle();
  if(view==="compras") return rCompras();
  if(view==="vender") return rVender();
  if(view==="reglas") return rReglas();
}

function rExplorar(){
  const unis=["Todas",...new Set(allPacks().map(p=>p.uni))];
  const list=allPacks().filter(p=>(filtro==="Todas"||p.uni===filtro)&&(p.titulo+p.curso+p.uni).toLowerCase().includes(q.toLowerCase()));
  app.innerHTML=`<section class="hero">
    <h1>Material de quienes ya aprobaron tu curso</h1>
    <p class="muted">Apuntes, ejercicios resueltos y videos hechos por alumnos verificados. Todo contenido es original y revisado antes de publicarse.</p>
    <div class="search"><input id="q" type="search" placeholder="Busca un curso, por ejemplo Cálculo II" value="${esc(q)}" aria-label="Buscar curso"></div>
    <div class="chips" role="group" aria-label="Filtrar por universidad">${unis.map(u=>`<button class="chip" data-f="${esc(u)}" aria-pressed="${u===filtro}">${esc(u)}</button>`).join("")}</div>
  </section>
  <div class="list" style="margin-top:34px">${list.length?list.map(card).join(""):`<div class="empty panel"><h3>No hay packs para esa búsqueda</h3><p class="muted">¿Aprobaste ese curso? Puedes ser el primero en publicar uno.</p><button class="btn btn-primary" data-go2="vender">Publicar un pack</button></div>`}</div>`;
  const i=$("#q");i.oninput=e=>{q=e.target.value;const pos=i.selectionStart;rExplorar();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  bindCommon();
}

let actual=null;
function rDetalle(){
  const p=find(actual); if(!p) return go("explorar");
  const comprado=isComprado(p.id);
  const neto=(p.precio*0.7).toFixed(2);
  app.innerHTML=`<button class="btn btn-ghost" data-go2="explorar">← Volver</button>
  <div class="panel" style="margin-top:6px">
    <div class="small muted">${esc(p.uni)} · ${esc(p.curso)} · ${esc(p.seccion)}</div>
    <h2 style="margin-top:4px">${esc(p.titulo)}</h2>
    <div class="meta"><span class="badge b-ok">✓ Autor verificado</span><span>${esc(cache.authors[p.autor_id]||"Autor verificado")} aprobó con ${p.nota}</span><span>★ ${p.rating} · ${p.resenas} reseñas</span></div>
    <p style="margin-top:12px">${esc(p.descripcion)}</p>
  </div>
  <div class="panel"><h3>Qué incluye</h3><ul class="contents">${p.tipos.map(t=>`<li>${esc(TIPOS[t])}</li>`).join("")}</ul></div>
  <div class="panel"><h3>Vista previa gratuita</h3><div class="preview">${esc(p.preview).replace(/\n/g,"<br>")}</div></div>
  <div class="notice small">Licencia de uso personal: puedes estudiar con este pack, pero no compartirlo ni revenderlo. Cada página lleva tu correo como marca de agua. Tienes 48 horas para pedir reembolso si no coincide con la descripción.</div>
  <div style="display:grid;gap:10px;margin-top:16px">
    ${comprado?`<button class="btn btn-primary btn-block" data-ver="${p.id}">Abrir mi pack</button>`:isPend(p.id)?`<button class="btn btn-block" disabled>Pago en verificación</button>`:`<button class="btn btn-primary btn-block" data-buy="${p.id}">Comprar por S/ ${p.precio}</button>`}
    <button class="btn btn-danger btn-block" data-report="${p.id}">Denunciar este pack</button>
  </div>
  <p class="small muted" style="margin-top:12px">Las reseñas evalúan el pack, no al profesor del curso. El autor recibe S/ ${neto} de esta venta.</p>`;
  bindCommon();
}

function rCompras(){
  if(!me()) return gate("Mis packs","Inicia sesión para ver los packs que compraste y los que publicaste.");
  const mine=cache.purchases.filter(c=>c.estado==="confirmado").map(c=>c.packs).filter(Boolean);
  const pend=cache.purchases.filter(c=>c.estado==="en_verificacion").map(c=>({id:c.id,op:c.operacion,p:c.packs})).filter(x=>x.p);
  app.innerHTML=`<h1 style="margin-top:8px">Mis packs</h1>
  ${pend.map(x=>`<div class="panel"><div class="f-row"><h3>${esc(x.p.titulo)}</h3><span class="badge b-rev">Pago en verificación</span></div><p class="small muted">Yape · operación ${esc(x.op)} · S/ ${x.p.precio}. Te damos acceso apenas confirmemos el pago.</p><button class="btn small" data-confirm="${x.id}" style="margin-top:8px">Simular confirmación del pago</button></div>`).join("")}
  ${mine.length||pend.length?"":""}${mine.length?`<div class="list" style="margin-top:34px">${mine.map(p=>`<button class="folder" data-tab="${esc(p.curso)}" data-ver="${p.id}"><div class="f-row"><h3>${esc(p.titulo)}</h3><span class="badge b-ok">Comprado</span></div><p class="small muted">Toca para abrir</p></button>`).join("")}</div>`
  :pend.length?"":`<div class="panel empty"><h3>Aún no tienes packs</h3><p class="muted">Explora el catálogo y revisa la vista previa gratuita antes de comprar.</p><button class="btn btn-primary" data-go2="explorar">Explorar packs</button></div>`}
  ${cache.myPacks.length?`<h2 style="margin-top:26px">Packs que publiqué</h2>${cache.myPacks.map(p=>`<div class="panel"><div class="f-row"><h3>${esc(p.titulo)}</h3>${p.estado==="publicado"?`<span class="badge b-ok">Publicado</span>`:`<span class="badge b-rev">En revisión</span>`}</div><p class="small muted">${esc(p.uni)} · ${esc(p.curso)} · S/ ${p.precio} · recibes S/ ${(p.precio*0.7).toFixed(2)} por venta</p>${p.estado!=="publicado"?`<button class="btn small" data-aprobar="${p.id}" style="margin-top:8px">Simular aprobación del moderador</button>`:""}</div>`).join("")}`:""}`;
  bindCommon();
}

function rVender(){
  if(!me()) return gate("Publica tu pack","Crea una cuenta para vender tu material y recibir el 70% de cada venta.");
  app.innerHTML=`<h1 style="margin-top:8px">Publica tu pack</h1>
  <p class="muted">Gana el 70% de cada venta. Todo pack pasa por revisión antes de publicarse.</p>
  <div class="notice warn"><strong>Solo contenido tuyo.</strong> No se aceptan:
    <ul class="no-list"><li>Diapositivas, separatas o libros del profesor o de editoriales</li><li>Exámenes o tareas del ciclo en curso</li><li>Enunciados copiados de exámenes pasados</li></ul></div>

  <div class="panel"><div class="step"><span class="step-n">1</span><h3>Datos del curso</h3></div>
    <label class="f" for="v-tit">Título del pack</label><input class="t" id="v-tit" placeholder="Ej.: Integrales sin miedo">
    <label class="f" for="v-uni">Universidad</label><input class="t" id="v-uni" placeholder="Ej.: UNI">
    <label class="f" for="v-cur">Curso</label><input class="t" id="v-cur" placeholder="Ej.: Cálculo II">
    <label class="f" for="v-sec">Evaluación que cubre</label><select class="t" id="v-sec"><option>Parcial 1</option><option>Parcial 2</option><option>Final</option><option>Todo el curso</option></select>
    <label class="f" for="v-desc">Descripción<span class="help">Qué temas cubre y cuánto contenido tiene. Sin opiniones sobre docentes.</span></label><textarea class="t" id="v-desc"></textarea>
  </div>

  <div class="panel"><div class="step"><span class="step-n">2</span><h3>Contenido del pack</h3></div>
    <p class="small muted">Marca lo que incluye. Solo existen categorías de contenido propio.</p>
    ${Object.entries(TIPOS).map(([k,v])=>`<label class="check"><input type="checkbox" name="tipo" value="${k}"><span>${esc(v)}</span></label>`).join("")}
    <label class="f" for="v-prev">Vista previa gratuita<span class="help">Un fragmento corto que cualquiera puede leer.</span></label><textarea class="t" id="v-prev"></textarea>
    <label class="f" for="v-files">Archivos<span class="help">PDF o video. En este prototipo no se suben realmente.</span></label><input class="t" id="v-files" type="file" multiple>
    <label class="f" for="v-pre">Precio (S/)</label><input class="t" id="v-pre" type="number" min="5" max="80" value="25">
    <span class="earn" id="earn">Recibes S/ 17.50 por venta</span>
  </div>

  <div class="panel"><div class="step"><span class="step-n">3</span><h3>Verifica que aprobaste</h3></div>
    <label class="f" for="v-nota">Nota final obtenida<span class="help">Mínimo 14 para vender.</span></label><input class="t" id="v-nota" type="number" min="0" max="20" placeholder="Ej.: 17">
    <label class="f" for="v-rec">Récord de notas o consolidado<span class="help">Solo lo ve el equipo de revisión. Puedes tapar tu código de alumno.</span></label><input class="t" id="v-rec" type="file">
  </div>

  <div class="panel"><div class="step"><span class="step-n">4</span><h3>Declaración de autoría</h3></div>
    ${DECLARACIONES.map((d,i)=>`<label class="check"><input type="checkbox" name="decl" value="${i}"><span>${esc(d)}</span></label>`).join("")}
  </div>
  <div id="v-err" class="err" role="alert"></div>
  <button class="btn btn-primary btn-block" id="v-send" style="margin-top:14px">Enviar a revisión</button>`;
  const pre=$("#v-pre");pre.oninput=()=>{$("#earn").textContent=`Recibes S/ ${(Math.max(0,+pre.value||0)*0.7).toFixed(2)} por venta`};
  $("#v-send").onclick=enviar;
  bindCommon();
}

async function enviar(){
  const g=id=>$(id).value.trim();
  const tipos=[...document.querySelectorAll('input[name="tipo"]:checked')].map(i=>i.value);
  const decl=document.querySelectorAll('input[name="decl"]:checked').length;
  const errs=[];
  if(!g("#v-tit")||!g("#v-uni")||!g("#v-cur")) errs.push("Completa título, universidad y curso.");
  if(g("#v-desc").length<30) errs.push("Escribe una descripción de al menos 30 caracteres.");
  if(!tipos.length) errs.push("Marca al menos un tipo de contenido.");
  if(!g("#v-prev")) errs.push("Agrega una vista previa gratuita.");
  const precio=+g("#v-pre"); if(!(precio>=5&&precio<=80)) errs.push("El precio debe estar entre S/ 5 y S/ 80.");
  const nota=+g("#v-nota"); if(!(nota>=14&&nota<=20)) errs.push("Necesitas una nota de 14 o más para vender este curso.");
  if(!$("#v-rec").files.length) errs.push("Adjunta tu récord de notas para verificar tu nota.");
  if(decl<DECLARACIONES.length) errs.push("Acepta las seis declaraciones de autoría para continuar.");
  if(errs.length){$("#v-err").innerHTML=errs.map(esc).join("<br>");$("#v-err").scrollIntoView({block:"center"});return}
  const {error}=await supa.from('packs').insert({autor_id:me().id,titulo:g("#v-tit"),uni:g("#v-uni"),curso:g("#v-cur"),seccion:g("#v-sec"),descripcion:g("#v-desc"),preview:g("#v-prev"),tipos,precio,nota,estado:"revision"});
  if(error){$("#v-err").textContent="No se pudo enviar: "+error.message;return}
  await loadMine();toast("Enviado a revisión. Te avisamos en 48 horas.");go("compras");
}

function rReglas(){
  app.innerHTML=`<h1 style="margin-top:8px">Reglas de Aprobado</h1>
  <p class="muted">Enseñamos, no resolvemos evaluaciones. Estas reglas protegen a autores, compradores y universidades.</p>
  <div class="panel"><h3>Qué se puede vender</h3><p>Solo contenido creado por el autor: apuntes, resúmenes, ejercicios resueltos por él, videos propios, fórmulas y simulacros con preguntas redactadas por él.</p></div>
  <div class="panel"><h3>Qué está prohibido</h3><ul class="no-list"><li>Material del profesor, la universidad o editoriales</li><li>Evaluaciones del ciclo en curso y sus soluciones</li><li>Enunciados copiados de exámenes pasados</li><li>Datos personales de otras personas</li><li>Ofrecer resolver tareas o exámenes por encargo</li></ul></div>
  <div class="panel"><h3>Revisión y retiro</h3><p>Cada pack se revisa antes de publicarse. Si recibimos una denuncia fundada, lo retiramos, reembolsamos a los compradores y podemos suspender al autor.</p></div>
  <div class="panel"><h3>Licencia del comprador</h3><p>El comprador obtiene una licencia de uso personal. No puede compartir, publicar ni revender el pack. Cada página lleva su correo como marca de agua.</p></div>
  <div class="panel"><h3>Reembolsos</h3><p>Tienes 48 horas desde la compra para pedir reembolso si el pack no coincide con su descripción.</p></div>
  <div class="panel"><h3>Tus datos</h3><p>Usamos tu correo para darte acceso y marcar tus archivos. El récord de notas solo lo ve el equipo de revisión y se elimina tras verificarlo.</p></div>
  <div class="panel"><h3>Libro de Reclamaciones</h3><p class="muted small">Registra un reclamo o una queja sobre una compra.</p><button class="btn" id="libro" style="margin-top:8px">Registrar reclamo</button></div>
  <p class="small muted" style="margin-top:14px">Prototipo: los pagos, archivos y revisiones son simulados.</p>`;
  $("#libro").onclick=libro;
  bindCommon();
}

/* modals */
function open(html){$("#sheet").innerHTML=html;$("#scrim").classList.add("open");const f=$("#sheet").querySelector("input,button:not(.x),select,textarea");f&&f.focus();$("#sheet").querySelector(".x").onclick=close}
function close(){$("#scrim").classList.remove("open")}
$("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function comprar(id){
  const p=find(id);
  open(`<div class="sheet-head"><h2>Comprar pack</h2><button class="x" aria-label="Cerrar">×</button></div>
  <p><strong>${esc(p.titulo)}</strong></p>
  <div class="pay" role="radiogroup" aria-label="Método de pago">
    <label><input type="radio" name="pay" value="Yape" checked><span>Yape</span></label>
    <label class="off"><input type="radio" name="pay" value="Plin" disabled><span>Plin<small>Próximamente</small></span></label>
    <label class="off"><input type="radio" name="pay" value="Tarjeta" disabled><span>Tarjeta<small>Próximamente</small></span></label>
  </div>
  <div class="qrbox">
    <img src="${YAPE_QR}" alt="Código QR de Yape para pagar">
    <div class="amount">S/ ${p.precio.toFixed(2)}</div>
    <div class="small">Monto exacto a pagar</div>
  </div>
  <ol class="steps small">
    <li>Abre Yape y toca Escanear QR.</li>
    <li>Paga exactamente S/ ${p.precio.toFixed(2)}.</li>
    <li>Escribe abajo el número de operación que aparece en tu constancia.</li>
  </ol>
  <label class="f" for="b-op">Número de operación</label>
  <input class="t" id="b-op" inputmode="numeric" placeholder="Ej.: 12345678">
  <label class="f" for="b-cap">Captura del pago<span class="help">Opcional, pero agiliza la verificación.</span></label>
  <input class="t" id="b-cap" type="file" accept="image/*">
  <label class="f" for="b-mail">Correo<span class="help">Lo usamos para darte acceso y como marca de agua.</span></label>
  <input class="t" id="b-mail" type="email" value="${esc(cache.session?cache.session.user.email:"")}" placeholder="tucorreo@ejemplo.com">
  <label class="check" style="margin-top:10px"><input type="checkbox" id="b-lic"><span>Acepto la licencia de uso personal: no compartiré ni revenderé este pack.</span></label>
  <div id="b-err" class="err" role="alert"></div>
  <button class="btn btn-primary btn-block" id="b-ok" style="margin-top:10px">Ya pagué, enviar comprobante</button>
  <p class="small muted" style="margin-top:8px">Verificamos tu pago y te damos acceso. Recibirás tu comprobante por correo.</p>`);
  $("#b-ok").onclick=async()=>{
    const op=$("#b-op").value.replace(/\s/g,""), m=$("#b-mail").value.trim();
    if(!/^\d{4,20}$/.test(op)) return $("#b-err").textContent="Escribe el número de operación de tu constancia de Yape (solo números).";
    if(!/^\S+@\S+\.\S+$/.test(m)) return $("#b-err").textContent="Escribe un correo válido.";
    if(!$("#b-lic").checked) return $("#b-err").textContent="Acepta la licencia de uso personal para continuar.";
    if(!isPend(id)){
      const {error}=await supa.from('purchases').insert({pack_id:id,comprador_id:me().id,operacion:op});
      if(error){$("#b-err").textContent="No se pudo registrar: "+error.message;return}
    }
    await loadMine(); close();
    toast("Comprobante enviado. Verificamos tu pago."); go("compras");
  };
}

function ver(id){
  const p=find(id);
  const mark=`${esc(cache.session?cache.session.user.email:"comprador")} · ${esc(p.id)}`;
  open(`<div class="sheet-head"><h2>${esc(p.titulo)}</h2><button class="x" aria-label="Cerrar">×</button></div>
  <div class="viewer"><div class="wm" aria-hidden="true">${Array(60).fill(`<span>${mark}</span>`).join("")}</div>
  <div class="viewer-content"><div class="small muted">${esc(p.curso)} · ${esc(p.seccion)}</div>
  <p>${esc(p.preview).replace(/\n/g,"<br>")}</p>
  <p class="muted">El contenido completo se mostraría aquí: páginas y videos en el visor, sin descarga directa.</p>
  <ul class="contents">${p.tipos.map(t=>`<li>${esc(TIPOS[t])}</li>`).join("")}</ul></div></div>
  <button class="btn btn-ghost" id="refund" style="margin-top:8px">Pedir reembolso (48 horas)</button>`);
  $("#refund").onclick=async()=>{const c=cache.purchases.find(x=>x.pack_id===id);if(c)await supa.from('purchases').update({estado:"reembolsado"}).eq('id',c.id);await loadMine();close();toast("Reembolso solicitado");render()};
}

function denunciar(id){
  const motivos=["Contiene material del profesor, la universidad o una editorial","Contiene una evaluación del ciclo en curso o su solución","Copia contenido de otro autor","No coincide con la descripción","Incluye datos personales de otras personas"];
  open(`<div class="sheet-head"><h2>Denunciar pack</h2><button class="x" aria-label="Cerrar">×</button></div>
  <p class="muted small">Revisamos cada denuncia en 48 horas. Si procede, retiramos el pack y reembolsamos a los compradores.</p>
  ${motivos.map((m,i)=>`<label class="check"><input type="radio" name="mot" value="${i}"><span>${esc(m)}</span></label>`).join("")}
  <label class="f" for="d-det">Detalles<span class="help">Si eres titular del material, indícalo.</span></label><textarea class="t" id="d-det"></textarea>
  <div id="d-err" class="err" role="alert"></div>
  <button class="btn btn-danger btn-block" id="d-ok" style="margin-top:10px">Enviar denuncia</button>`);
  $("#d-ok").onclick=async()=>{const m=document.querySelector('input[name="mot"]:checked');if(!m)return $("#d-err").textContent="Elige un motivo.";await supa.from('reports').insert({pack_id:id,autor_id:me()?me().id:null,motivo:motivos[+m.value],detalle:$("#d-det").value});close();toast("Denuncia enviada")};
}

function libro(){
  open(`<div class="sheet-head"><h2>Libro de Reclamaciones</h2><button class="x" aria-label="Cerrar">×</button></div>
  <label class="f" for="l-nom">Nombre completo</label><input class="t" id="l-nom">
  <label class="f" for="l-tipo">Tipo</label><select class="t" id="l-tipo"><option>Reclamo (sobre el producto o servicio)</option><option>Queja (sobre la atención)</option></select>
  <label class="f" for="l-det">Detalle</label><textarea class="t" id="l-det"></textarea>
  <button class="btn btn-primary btn-block" id="l-ok" style="margin-top:12px">Registrar reclamo</button>`);
  $("#l-ok").onclick=()=>{if(!$("#l-nom").value.trim()||!$("#l-det").value.trim())return toast("Completa nombre y detalle");close();toast("Reclamo registrado. Respondemos en el plazo legal.")};
}

function gate(t,msg){
  app.innerHTML=`<h1 style="margin-top:8px">${t}</h1><div class="panel gate"><h3>Necesitas una cuenta</h3><p class="muted">${msg}</p><div class="btns"><button class="btn btn-primary" id="g-new">Crear cuenta</button><button class="btn" id="g-in">Iniciar sesión</button></div></div>`;
  $("#g-new").onclick=()=>auth("signup",render);$("#g-in").onclick=()=>auth("login",render);
}
function need(cb,msg){if(me())return cb();auth("login",cb,msg)}
function renderAcct(){
  const b=$("#acct"),u=me();
  if(u){b.innerHTML=`<span class="avatar" aria-hidden="true">${esc(u.nombre.trim()[0].toUpperCase())}</span>${esc(u.nombre.split(" ")[0])}`;b.setAttribute("aria-label","Mi cuenta: "+u.nombre)}
  else{b.textContent="Iniciar sesión";b.removeAttribute("aria-label")}
}
$("#acct").onclick=()=>me()?perfil():auth("login",render);

function auth(mode,cb,msg){
  const login=mode==="login";
  open(`<div class="sheet-head"><h2>${login?"Inicia sesión":"Crea tu cuenta"}</h2><button class="x" aria-label="Cerrar">×</button></div>
  <div class="seg" role="tablist"><button role="tab" aria-selected="${login}" id="t-in">Iniciar sesión</button><button role="tab" aria-selected="${!login}" id="t-new">Crear cuenta</button></div>
  ${msg?`<p class="small muted">${esc(msg)}</p>`:""}
  ${login?`
    <label class="f" for="a-mail">Correo</label><input class="t" id="a-mail" type="email" autocomplete="email">
    <label class="f" for="a-pw">Contraseña</label><input class="t" id="a-pw" type="password" autocomplete="current-password">
    <div id="a-err" class="err" role="alert"></div>
    <button class="btn btn-primary btn-block" id="a-ok" style="margin-top:12px">Iniciar sesión</button>
    <button class="btn btn-ghost" id="a-forgot" style="margin-top:4px">¿Olvidaste tu contraseña?</button>`
  :`
    <label class="f" for="a-nom">Nombre y apellido</label><input class="t" id="a-nom" autocomplete="name">
    <label class="f" for="a-mail">Correo</label><input class="t" id="a-mail" type="email" autocomplete="email">
    <label class="f" for="a-uni">Universidad</label><input class="t" id="a-uni" placeholder="Ej.: UNI">
    <label class="f" for="a-car">Carrera</label><input class="t" id="a-car" placeholder="Ej.: Ingeniería Civil">
    <label class="f" for="a-pw">Contraseña<span class="help">Mínimo 8 caracteres.</span></label><input class="t" id="a-pw" type="password" autocomplete="new-password">
    <label class="f" for="a-pw2">Repite la contraseña</label><input class="t" id="a-pw2" type="password" autocomplete="new-password">
    <label class="check" style="margin-top:10px"><input type="checkbox" id="a-terms"><span>Acepto las reglas de Aprobado y el uso de mis datos descrito en la sección Reglas.</span></label>
    <div id="a-err" class="err" role="alert"></div>
    <button class="btn btn-primary btn-block" id="a-ok" style="margin-top:12px">Crear cuenta</button>`}
  <p class="small muted" style="margin-top:10px">Tu cuenta se guarda de forma segura en el servidor.</p>`);
  $("#t-in").onclick=()=>auth("login",cb,msg);
  $("#t-new").onclick=()=>auth("signup",cb,msg);
  const err=t=>$("#a-err").textContent=t;
  if(login){
    $("#a-forgot").onclick=()=>toast("Te enviaríamos un enlace para cambiar tu contraseña.");
    $("#a-ok").onclick=async()=>{
      const email=$("#a-mail").value.trim().toLowerCase(),pw=$("#a-pw").value;
      const {error}=await supa.auth.signInWithPassword({email,password:pw});
      if(error)return err("Correo o contraseña incorrectos.");
      await refreshSession();await loadMine();close();renderAcct();toast("Hola de nuevo, "+(me()?me().nombre.split(" ")[0]:""));cb?cb():render();
    };
  }else{
    $("#a-ok").onclick=async()=>{
      const v=id=>$(id).value.trim();
      const nombre=v("#a-nom"),email=v("#a-mail").toLowerCase(),uni=v("#a-uni"),carrera=v("#a-car"),pw=$("#a-pw").value;
      if(nombre.length<2)return err("Escribe tu nombre.");
      if(!/^\S+@\S+\.\S+$/.test(email))return err("Escribe un correo válido.");
      if(!uni)return err("Escribe tu universidad.");
      if(pw.length<8)return err("La contraseña debe tener al menos 8 caracteres.");
      if(pw!==$("#a-pw2").value)return err("Las contraseñas no coinciden.");
      if(!$("#a-terms").checked)return err("Acepta las reglas para crear tu cuenta.");
      const {data,error}=await supa.auth.signUp({email,password:pw,options:{data:{nombre,uni,carrera}}});
      if(error)return err(error.message==="User already registered"?"Ya existe una cuenta con ese correo. Inicia sesión.":error.message);
      if(!data.session){close();toast("Cuenta creada. Revisa tu correo para confirmarla antes de iniciar sesión.");return}
      await refreshSession();await loadMine();close();renderAcct();toast("Cuenta creada. Bienvenido, "+nombre.split(" ")[0]);cb?cb():render();
    };
  }
}
function perfil(){
  const u=me(),d={compras:cache.purchases.filter(c=>c.estado==="confirmado"),mios:cache.myPacks};
  open(`<div class="sheet-head"><h2>Mi cuenta</h2><button class="x" aria-label="Cerrar">×</button></div>
  <div class="panel" style="margin-top:0"><h3>${esc(u.nombre)}</h3><p class="small muted">${esc(cache.session?cache.session.user.email:"")}</p><p class="small">${esc(u.uni)}${u.carrera?" · "+esc(u.carrera):""}</p></div>
  <div class="panel"><p class="small"><strong>${d.compras.length}</strong> packs comprados · <strong>${d.mios.length}</strong> packs publicados</p></div>
  <button class="btn btn-danger btn-block" id="p-out" style="margin-top:14px">Cerrar sesión</button>`);
  $("#p-out").onclick=async()=>{await supa.auth.signOut();await refreshSession();cache.myPacks=[];cache.purchases=[];close();renderAcct();toast("Sesión cerrada");go("explorar")};
}

function bindCommon(){
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{actual=b.dataset.open;view="detalle";render();window.scrollTo(0,0)});
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>go(b.dataset.go2));
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;rExplorar()});
  app.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>need(()=>comprar(b.dataset.buy),"Inicia sesión para comprar este pack."));
  app.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>ver(b.dataset.ver));
  app.querySelectorAll("[data-report]").forEach(b=>b.onclick=()=>denunciar(b.dataset.report));
  app.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=async()=>{await supa.from('purchases').update({estado:"confirmado"}).eq('id',b.dataset.confirm);await loadMine();toast("Pago confirmado. Ya puedes abrir tu pack.");render()});
  app.querySelectorAll("[data-aprobar]").forEach(b=>b.onclick=async()=>{await supa.from('packs').update({estado:"publicado"}).eq('id',b.dataset.aprobar);await loadMine();await loadPublicPacks();toast("Pack publicado");render()});
}
(async()=>{
  await refreshSession();
  await loadPublicPacks();
  if(me())await loadMine();
  renderAcct();
  render();
  supa.auth.onAuthStateChange(async()=>{
    await refreshSession();
    if(me())await loadMine();else{cache.myPacks=[];cache.purchases=[]}
    renderAcct();
  });
})();
</script>
</body>
</html>
